name: Validador de K8s

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  validar-yaml:
    runs-on: ubuntu-latest
    steps:
    - name: Copiar código al servidor de GitHub
      uses: actions/checkout@v4

    - name: Validar manifiesto de Kubernetes sin clúster (Offline)
      run: |
        echo "Validando sintaxis y esquema local de app.yaml..."
        kubectl apply --dry-run=client --validate=strict -f app.yaml
