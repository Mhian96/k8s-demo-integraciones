name: Validador de K8s

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  validar-yaml:
    runs-on: ubuntu-latest
    steps:
    - name: Copiar código al servidor de GitHub
      uses: actions/checkout@v4

    - name: Instalar Kubeconform de forma oficial
      run: |
        echo "Instalando kubeconform..."
        sh -c "$(curl -sL https://raw.githubusercontent.com/yannh/kubeconform/master/scripts/download.sh)" -- v0.6.7 /usr/local/bin

    - name: Ejecutar validación estática de app.yaml
      run: |
        kubeconform -summary app.yaml
