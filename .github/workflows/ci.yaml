name: Validador de K8s

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  validar-yaml:
    runs-on: ubuntu-latest
    steps:
    - name: Copiar código al servidor de GitHub
      uses: actions/checkout@v4

    - name: Instalar Kubeconform directamente
      run: |
        echo "Descargando el binario oficial de kubeconform..."
        curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform_linux_amd64.tar.gz -o kubeconform.tar.gz
        tar -xzf kubeconform.tar.gz
        sudo chmod +x kubeconform
        sudo mv kubeconform /usr/local/bin/

    - name: Ejecutar validación estática de app.yaml
      run: |
        kubeconform -summary app.yaml
