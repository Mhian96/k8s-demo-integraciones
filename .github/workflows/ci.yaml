name: Validador de K8s

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  validar-yaml:
    runs-on: ubuntu-latest
    steps:
    - name: Copiar código al servidor de GitHub
      uses: actions/checkout@v4

    - name: Instalar kubectl y validar manifiesto
      run: |
        echo "Verificando versión de kubectl..."
        kubectl version --client

        echo "Validando sintaxis de app.yaml..."
        kubectl apply --dry-run=client -f app.yaml
