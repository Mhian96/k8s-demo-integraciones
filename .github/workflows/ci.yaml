name: Validador de K8s

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  validar-yaml:
    runs-on: ubuntu-latest
    steps:
    - name: Copiar código al servidor de GitHub
      uses: actions/checkout@v4

    - name: Instalar Kubeconform mediante Go
      run: |
        echo "Instalando kubeconform con go install..."
        go install github.com/yannh/kubeconform/cmd/kubeconform@latest

    - name: Ejecutar validación estática de app.yaml
      run: |
        # Agregamos el directorio de binarios de go al PATH temporalmente
        export PATH=$PATH:$(go env GOPATH)/bin
        kubeconform -summary app.yaml
