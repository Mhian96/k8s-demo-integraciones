apiVersion: apps/v1beta99_inventado  #antes apps/v1
kind: Deployment
metadata:
  name: mi-web-deploy
  namespace: mi-namespace-web-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mi-web
  template:
    metadata:
      labels:
        app: mi-web
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mi-web-service
  namespace: mi-namespace-web-deploy
spec:
  type: NodePort
  selector:
    app: mi-web
  ports:
    - port: 8080
      targetPort: 80
